# Progetti del laboratorio.
# `status: current` li mette fra quelli attivi, `past` fra i conclusi; una
# sezione senza progetti non compare.
# `areas` usa le chiavi di _data/areas.yml: sono le etichette sulle card.
# L'ordine qui è quello mostrato in pagina, dal più recente.
#
# Ogni voce è resa su quattro righe:
#   1. acronym + period + role
#   2. title               il titolo per esteso
#   3. scope + project     dove si colloca la voce nella gerarchia (facoltativi)
#   4. programme/funding, poi i partner
# I campi testuali vuoti ("") non vengono mostrati.
