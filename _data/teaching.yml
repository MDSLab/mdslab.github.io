# Corsi tenuti da membri del gruppo. I dati vengono dal curriculum, aggiornato ad
# aprile 2024, integrato per i corsi avviati dopo quella data.
# `status: current` per i corsi ancora attivi, `past` per quelli conclusi.
#
# CONVENZIONE. `role` distingue chi tiene l'intero corso da chi ne tiene un modulo:
# "Course leader" per la titolarità, "Module lecturer" quando l'insegnamento è una
# parte di un corso integrato. Il dato va indicato sempre, perché un modulo da 2 CFU
# dentro un corso altrui non è la stessa cosa di un corso da 12 CFU.
#
# Il docente non sta nelle singole voci: essendo lo stesso per tutti i corsi, la
# pagina lo dichiara una volta in apertura. Se un giorno insegnerà anche qualcun
# altro del gruppo, andrà reintrodotto un campo `teacher` per voce.
#
# `scope` si compila solo quando CFU e ore non sono quelli del corso intero, per
# esempio perché la pagina riguarda un singolo modulo: la testata lo stampa fra
# parentesi dopo le ore, così il numero non viene letto come se fosse del corso.
#
# `programme` porta il nome ufficiale del corso di studi: in italiano per i corsi
# erogati in italiano, in inglese per quelli erogati in inglese. È un nome proprio,
# non si traduce. Il livello non va ripetuto nel nome (niente "Dottorato in
# Ingegneria"): lo dichiara già `level`, che la pagina rende come etichetta.
#
# `links` raccoglie gli indirizzi esterni del corso: `elearning` è lo spazio del
# corso sulla piattaforma di Ateneo, `catalogue` è la scheda ufficiale nel Course
# Catalogue, `archive_1`, `archive_2` e `archive_3` sono gli archivi dei testi degli
# appelli precedenti, uno per prova scritta. I primi due contengono l'anno accademico
# nei parametri e vanno rifatti a ogni nuova offerta; gli archivi vengono citati da
# più risposte della stessa pagina. Stando qui si cambiano in un punto solo invece
# che dentro il testo delle pagine.
#
# `credits` e `hours` sono CFU e ore di didattica frontale. `since` è il primo anno
# accademico di titolarità: dice da quanto il corso è tenuto, che è informazione
# diversa dall'anno corrente.

