{%- comment -%}
Due casi in cui un accordion si rompe, e che <details> da solo non copre:
un collegamento a una domanda chiusa, e la stampa della pagina.
{%- endcomment -%}
<script>
(function () {
  function openFromHash() {
    var el = location.hash && document.querySelector(location.hash);
    if (el && el.tagName === 'DETAILS') {
      el.open = true;
      el.scrollIntoView();
    }
  }
  window.addEventListener('hashchange', openFromHash);
  openFromHash();

  // Il tema intercetta i clic sulle ancore interne per lo scorrimento morbido e
  // non cambia l'hash, quindi 'hashchange' non basta: apriamo la domanda qui, in
  // fase di cattura, prima che il gestore del tema annulli l'evento.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var el = document.querySelector(a.getAttribute('href'));
    if (el && el.tagName === 'DETAILS') el.open = true;
  }, true);

  // In stampa il contenuto chiuso non comparirebbe: apriamo tutto e poi
  // rimettiamo le cose come le aveva lasciate il lettore.
  var wasOpen = [];
  window.addEventListener('beforeprint', function () {
    wasOpen = [];
    document.querySelectorAll('details.faq-item').forEach(function (d) {
      wasOpen.push(d.open);
      d.open = true;
    });
  });
  window.addEventListener('afterprint', function () {
    document.querySelectorAll('details.faq-item').forEach(function (d, i) {
      d.open = wasOpen[i];
    });
  });
})();
</script>
